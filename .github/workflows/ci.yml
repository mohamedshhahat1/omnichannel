name: CI

on:
  push:
    branches:
      - main
      - phase-2-infrastructure
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # We use the explicitly documented temporary offline pin-set for best-effort reproducibility.
          pip install -r requirements.lock
          pip install -e ".[dev]"
          
      - name: Ruff format
        working-directory: backend
        run: ruff format --check .
        
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
        
      - name: MyPy
        working-directory: backend
        run: mypy

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"
          
      - name: Run unit tests
        working-directory: backend
        run: pytest -m "not integration"

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omnichannel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_postgres_password
          OC_APP_PASSWORD: test_oc_app_password
          OC_MIGRATOR_PASSWORD: test_oc_migrator_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omnichannel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"
          
      - name: Initialize PostgreSQL roles
        run: |
          PGPASSWORD=test_postgres_password psql -h 127.0.0.1 -U postgres -d omnichannel_test -f infra/postgres/init/10-roles.sql
          
      - name: Run Alembic migrations
        working-directory: backend
        env:
          OC_DATABASE__MIGRATION_URL: postgresql+asyncpg://oc_migrator:test_oc_migrator_password@127.0.0.1:5432/omnichannel_test
        run: alembic upgrade head
        
      - name: Run integration tests
        working-directory: backend
        env:
          OC_TEST_DATABASE_URL: postgresql+asyncpg://oc_app:test_oc_app_password@127.0.0.1:5432/omnichannel_test
          OC_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: pytest -m "integration"

  docker-build:
    name: Docker Build & Compose Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate Docker Compose
        env:
          OC_APP_PASSWORD: ci_dummy_password
          OC_MIGRATOR_PASSWORD: ci_dummy_password
        run: docker compose config
        
      - name: Build backend image
        working-directory: backend
        run: docker build -t omnichannel-backend:ci .

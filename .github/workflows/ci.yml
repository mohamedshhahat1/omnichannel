# CI pipeline — pre-Phase-3 foundation.
#
# Runs the repository's real quality gates as seven separate required checks:
# Ruff lint, Ruff format, MyPy, unit Pytest, integration Pytest against real
# PostgreSQL/Redis service containers, a production Docker image build, and
# Docker Compose configuration validation. No deployment, no image pushes, no
# secrets, least-privilege permissions.
#
# CI results are verified by the human operator. Automated agents (including
# Opus) must not access GitHub Actions results or request CI credentials.
name: CI

on:
  push:
    branches:
      - main
      - phase-2-infrastructure
  pull_request:

# Least privilege: read-only checkout is the only repository access needed.
permissions:
  contents: read

jobs:
  ruff-lint:
    name: Ruff lint
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Supported range per backend/pyproject.toml (requires-python
          # ">=3.12,<3.14"); 3.13 matches backend/Dockerfile (python:3.13-slim).
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install Ruff
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # Linting needs only Ruff. The pinned version is derived from the
          # committed lock file, never duplicated in this workflow.
          pip install "$(grep '^ruff==' requirements.lock)"

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

  ruff-format:
    name: Ruff format
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install Ruff
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep '^ruff==' requirements.lock)"

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

  mypy:
    name: MyPy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # Type checking needs the application's dependencies installed (the
          # pydantic MyPy plugin and the imported packages). Uses the
          # documented temporary offline-authored pin set; transitive
          # dependencies float until the lock is regenerated with a resolver.
          pip install -r requirements.lock

      - name: MyPy
        working-directory: backend
        run: mypy

  pytest-unit:
    name: Pytest (unit)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run unit tests
        working-directory: backend
        run: pytest -m "not integration"

  pytest-integration:
    name: Pytest (integration)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        # Same image as docker-compose.yml.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omnichannel
          POSTGRES_USER: postgres
          # CI-only throwaway credential for the ephemeral service container;
          # not a real secret and never used outside this job.
          POSTGRES_PASSWORD: ci_dummy_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omnichannel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        # Same image as docker-compose.yml; tests use a real Redis server.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Enable pg_stat_statements and restart PostgreSQL
        run: |
          set -euo pipefail
          POSTGRES_CID="$(docker ps --filter 'ancestor=pgvector/pgvector:pg16' --format '{{.ID}}')"
          if [ -z "$POSTGRES_CID" ]; then
            echo "::error::PostgreSQL service container not found"
            exit 1
          fi
          echo "PostgreSQL service container: $POSTGRES_CID"
          # pg_stat_statements must be loaded via shared_preload_libraries
          # before CREATE EXTENSION can succeed. GitHub service containers
          # cannot override the image command, so set it via ALTER SYSTEM and
          # restart the ephemeral container (mirrors the Compose `command:`).
          docker exec "$POSTGRES_CID" psql -U postgres -d omnichannel \
            -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart "$POSTGRES_CID" >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CID" pg_isready -U postgres -d omnichannel --quiet; then
              echo "PostgreSQL ready after restart (attempt $attempt)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::PostgreSQL did not become ready within 30s of restart"
          exit 1

      - name: Apply committed role bootstrap
        run: |
          set -euo pipefail
          POSTGRES_CID="$(docker ps --filter 'ancestor=pgvector/pgvector:pg16' --format '{{.ID}}')"
          # Apply infra/postgres/init/10-roles.sql verbatim (the Compose
          # entrypoint normally does this). The roles use the repository's
          # documented local-development example passwords; this database is
          # ephemeral and exists only for the duration of this job.
          docker exec -i "$POSTGRES_CID" psql -U postgres -d omnichannel \
            < infra/postgres/init/10-roles.sql

      - name: Pre-create extensions as superuser
        run: |
          set -euo pipefail
          POSTGRES_CID="$(docker ps --filter 'ancestor=pgvector/pgvector:pg16' --format '{{.ID}}')"
          # Extension creation is privileged; oc_migrator is intentionally
          # NOSUPERUSER. Pre-create as the ephemeral superuser so the Alembic
          # migration's CREATE EXTENSION IF NOT EXISTS statements no-op.
          docker exec "$POSTGRES_CID" psql -U postgres -d omnichannel -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS "pgcrypto"' \
            -c 'CREATE EXTENSION IF NOT EXISTS "pg_stat_statements"' \
            -c 'CREATE EXTENSION IF NOT EXISTS "pg_trgm"' \
            -c 'CREATE EXTENSION IF NOT EXISTS "vector"'

      - name: Run Alembic migrations
        working-directory: backend
        env:
          # Migrator role from the committed bootstrap SQL (documented
          # local-development example credentials; ephemeral CI database).
          OC_DATABASE__MIGRATION_URL: postgresql+asyncpg://oc_migrator:oc_migrator_password@127.0.0.1:5432/omnichannel
        run: alembic upgrade head

      - name: Run integration tests
        working-directory: backend
        env:
          # The project's documented opt-in contract (backend/.env.example):
          # real PostgreSQL via asyncpg and real Redis — never SQLite or fakes.
          OC_TEST_DATABASE_URL: postgresql+asyncpg://oc_app:oc_app_password@127.0.0.1:5432/omnichannel
          OC_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: pytest -m "integration"

  docker-build:
    name: Docker build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        working-directory: backend
        # Build only: no registry login, no push, no deployment.
        run: docker build -t omnichannel-backend:ci .

  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        # docker-compose.yml interpolates no environment variables, so no
        # CI-only dummy values are required; the rendered output contains only
        # the repository's committed local-development example values.
        run: docker compose config
